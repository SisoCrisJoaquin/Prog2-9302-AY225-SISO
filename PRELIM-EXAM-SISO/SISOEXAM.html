<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Record System - Siso</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border: 1px solid #ddd;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        /* Form */
        .form-section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            background: #fafafa;
        }

        .form-section h3 {
            margin-bottom: 15px;
            color: #444;
        }

        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: end;
        }

        .form-group {
            flex: 1;
            min-width: 120px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        #addBtn {
            padding: 8px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        #addBtn:hover {
            background: #45a049;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            background: #f0f0f0;
            font-weight: bold;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .delete-btn {
            padding: 5px 10px;
            background: #f44336;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            background: #d32f2f;
        }

        .no-data {
            text-align: center;
            color: #999;
            font-style: italic;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 15px;
            color: #666;
            font-size: 12px;
            border-top: 1px solid #ddd;
        }

        .student-count {
            float: right;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Record System</h1>

        <!-- Form -->
        <div class="form-section">
            <h3>Add New Student</h3>
            <div class="form-row">
                <div class="form-group">
                    <label for="idInput">Student ID</label>
                    <input type="text" id="idInput" placeholder="Enter ID">
                </div>
                <div class="form-group">
                    <label for="nameInput">Name</label>
                    <input type="text" id="nameInput" placeholder="Enter Name">
                </div>
                <div class="form-group">
                    <label for="gradeInput">Grade</label>
                    <input type="text" id="gradeInput" placeholder="Enter Grade">
                </div>
                <button id="addBtn">Add</button>
            </div>
        </div>

        <!-- Table -->
        <div>
            <span class="student-count">Total: <span id="studentCount">0</span> students</span>
            <table>
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Grade</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                </tbody>
            </table>
        </div>

        <!-- Footer -->
        <div class="footer">
            Siso, Cris Joaquin E. | 112-0080
        </div>
    </div>

    <script src="SISOEXAM.js"></script>
</body>
</html>
